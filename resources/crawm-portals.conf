# xdg-desktop-portal configuration for crawm.
#
# See https://flatpak.github.io/xdg-desktop-portal/docs/ for the format. Landed
# with the screencast backend in M9; installed to
# `/usr/share/xdg-desktop-portal/crawm-portals.conf`.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
