# crawm configuration.
#
# This is the shipped default; copy it to $XDG_CONFIG_HOME/crawm/config.toml
# (usually ~/.config/crawm/config.toml) and edit. Check it with
# `crawm --validate --config <path>`.

# Space between and around windows, in logical pixels.
gaps = 8

# Window border.
border_width = 2
border_color = "#7aa2f7"
unfocused_border_color = "#3b4261"

# Layout used for new spaces: `tile`, `monocle`, `floating`, `scroll` or
# `vertical-scroll`, or a family name (`stack`, `tile`, `scroll`) as an alias
# for that family's default mode.
layout = "tile"

# Master area (the `tile` layout): how many windows sit in it, and its size as a
# fraction of the usable area.
master_count = 1
master_ratio = 0.6

[animations]
enabled = true
