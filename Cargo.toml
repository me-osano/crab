# crawm — package root AND workspace root (niri-style): the compositor itself
# lives in `src/` here; library crates sit alongside it at the repository root.
# Layout and boundary rules live in ROADMAP.md §5. The pure crates
# (crawm-core / crawm-layout / crawm-anim / crawm-config) must never depend on
# Smithay or Wayland; `scripts/check-boundaries.sh` enforces this in CI.

[package]
name = "crawm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The crawm Wayland compositor."

[workspace]
resolver = "3" # edition 2024's resolver (MSRV-aware); see docs/decisions/
members = [
  ".",
  "crawm-core",
  "crawm-anim",
  "crawm-layout",
  "crawm-config",
  "crawm-ipc",
  "crawm-msg",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "A Wayland compositor merging mango tags, niri scrolling, and cosmic protocol breadth."
authors = ["crawm contributors"]

[workspace.dependencies]
# Internal crates (path + version so they can be published later).
crawm-core = { path = "crawm-core", version = "0.0.0" }
crawm-anim = { path = "crawm-anim", version = "0.0.0" }
crawm-layout = { path = "crawm-layout", version = "0.0.0" }
crawm-config = { path = "crawm-config", version = "0.0.0" }
crawm-ipc = { path = "crawm-ipc", version = "0.0.0" }

# External.
anyhow = "1"
bitflags = "2"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Renderer is GLES (ADR-0002): Vulkan is deliberately never enabled, and
# xwayland arrives in M9. `renderer_multi` + the DRM/session/input backends are
# enabled now to prove the bare-metal dependency stack builds (TODO 0.4).
smithay = { version = "0.7", default-features = false, features = [
  "backend_winit",
  "backend_x11",
  "backend_drm",
  "backend_gbm",
  "backend_libinput",
  "backend_udev",
  "backend_session_libseat",
  "desktop",
  "renderer_gl",
  "renderer_multi",
  "wayland_frontend",
] }

# The compositor binary (`src/main.rs`) — everything that touches Smithay.
[dependencies]
crawm-core = { workspace = true }
crawm-anim = { workspace = true }
crawm-layout = { workspace = true }
crawm-config = { workspace = true }
crawm-ipc = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
smithay = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
