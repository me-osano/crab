# crab — package root AND workspace root (niri-style): the compositor itself
# lives in `src/` here; the remaining library crates sit alongside it at the
# repository root. Layout and boundary rules live in ROADMAP.md §5.
#
# The package is lib + bin: `src/lib.rs` is the pure, Smithay-free surface
# (src/{core,config,layout,animation}) and `src/main.rs` is the thin Smithay entry
# point. `scripts/check-boundaries.sh` enforces both that boundary and the
# downward-only dependency layering between the pure modules.

[package]
name = "crab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The crab Wayland compositor."

[workspace]
resolver = "3" # edition 2024's resolver (MSRV-aware); see docs/decisions/
members = [
  ".",
  "crab-ipc",
  "crab-cli",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "A Wayland compositor merging mango tags, niri scrolling, and cosmic protocol breadth."
authors = ["crab contributors"]

[workspace.dependencies]
# Internal crates (path + version so they can be published later).
crab-ipc = { path = "crab-ipc", version = "0.0.0" }

# External.
anyhow = "1"
bitflags = "2"
clap = { version = "4", features = ["derive", "env"] }
font8x8 = { version = "0.3", default-features = false, features = ["std"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Property testing for the pure layout/space invariants (TODO §2.8). `fork` and
# `regex` are off: they pull `rusty-fork`/`tempfile` and `regex-syntax`, which
# crab does not need, keeping the dev-dependency tree small.
proptest = { version = "1", default-features = false, features = ["std"] }

# The two-output tests drive real protocol requests through an in-process
# client/server socket pair (TODO §2.9 C6). Versions track Smithay 0.7's
# `wayland-server`/`wayland-protocols` so the client and server bind the same
# generated interfaces; the `client` features stay here so a normal build does
# not compile them.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# Smithay is pinned to 0.7 (ADR-0002: GLES only, never Vulkan; xwayland in M9).
# Only the renderer and frontend are unconditional — the backend stacks are
# enabled by the `backend-*` features below, so a default build does not pull the
# DRM/session/input stack.
smithay = { version = "0.7", default-features = false, features = [
  "desktop",
  "renderer_gl",
  "wayland_frontend",
] }

# The `crab` package: the library (`src/lib.rs`, pure) plus the binary
# (`src/main.rs`, Smithay glue). The pure modules pull in only pure deps:
# serde/toml/thiserror for config parsing.
[dependencies]
anyhow = { workspace = true }
bitflags = { workspace = true }
clap = { workspace = true }
crab-ipc = { workspace = true }
font8x8 = { workspace = true }
notify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smithay = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# The two-output tests drive real protocol requests through an in-process
# client/server socket pair, so the compositor sees the same commits and
# configures a real client would send.
wayland-client = { workspace = true }
wayland-protocols = { workspace = true }
wayland-protocols-wlr = { workspace = true }

[features]
default = ["backend-winit"]

# Nested window on an existing Wayland/X11 session (development, the default).
backend-winit = ["smithay/backend_winit"]
# Bare-metal DRM/KMS session (M4): pulls the session/input/GBM stack, so it is
# off by default; CI builds it with `--all-features` to keep proving the stack
# (TODO 0.4).
backend-tty = [
  "smithay/backend_drm",
  "smithay/backend_gbm",
  "smithay/backend_libinput",
  "smithay/backend_udev",
  "smithay/backend_session_libseat",
  "smithay/renderer_multi",
]
# X11 window backend; no `--backend` value selects it yet, but it is kept so the
# X11 stack keeps building under `--all-features`.
backend-x11 = ["smithay/backend_x11"]

[lints]
workspace = true

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
