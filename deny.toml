# cargo-deny configuration. Run with `cargo deny check`.
#
# crab is GPL-3.0-or-later (ADR-0001), so copyleft dependencies are acceptable,
# but every dependency must have an explicit license we have reviewed.

[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "GPL-3.0-or-later",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Vendored/patched Smithay (HDR, post-0.1) will be added here when it lands.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
